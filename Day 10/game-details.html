<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameStore - Game Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --accent: #d57454;
            --bg: #0a0c0e;
            --card: #12151a;
            --border: #1e2228;
            --text: #e8e0d6;
            --dim: #7a8090;
        }
        body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); }

        .navbar-brand {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.6rem; font-weight: 800;
            color: var(--accent) !important;
            letter-spacing: 2px;
        }
        .back-link {
            color: var(--dim); font-weight: 600; font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 1px;
            text-decoration: none; transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent); }

        .detail-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }
        .detail-img {
            width: 100%; height: 320px;
            object-fit: cover;
            display: block;
        }
        .game-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 2.8rem; font-weight: 800;
            text-transform: uppercase;
            color: var(--accent);
            line-height: 1;
        }
        .game-tag {
            font-size: 0.78rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
            padding: 3px 12px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            display: inline-block;
        }
        .spec-label {
            color: var(--accent);
            font-weight: 700; font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .specs-table td { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        .specs-table tr:last-child td { border-bottom: none; }

        .buy-area { background: #0d0f12; border-top: 1px solid var(--border); }
        .price-display {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 3rem; font-weight: 800;
            color: var(--accent);
        }
        .btn-buy {
            background: var(--accent); color: #fff;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.2rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px;
            border: none; border-radius: 4px;
            padding: 14px 48px;
            transition: background 0.2s, transform 0.1s;
            text-decoration: none; display: inline-block;
        }
        .btn-buy:hover { background: #bf5f40; color: #fff; transform: translateY(-2px); }

        .btn-download {
            background: #27ae60; color: #fff;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.2rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px;
            border: none; border-radius: 4px;
            padding: 14px 48px; cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-block;
        }
        .btn-download:hover { background: #1e8449; transform: translateY(-2px); }

        .free-price {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 3rem; font-weight: 800;
            color: #27ae60;
        }
        .badge-free {
            background: #27ae60; color: #fff;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.75rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px;
            padding: 3px 10px; border-radius: 3px;
            display: inline-block; margin-left: 8px;
            vertical-align: middle;
        }

        [data-accent] { --accent: attr(data-accent); } 
        #not-found { display: none; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark sticky-top border-bottom border-secondary" style="background:#0d0f12;">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="Home.html">🎮 GameStore</a>
        <a href="Home.html" class="back-link">← Back to Store</a>
    </div>
</nav>

<div id="loading" class="text-center py-5">
    <div class="spinner-border text-secondary" role="status"></div>
    <p class="text-secondary mt-3 small text-uppercase letter-spacing-1">Loading game…</p>
</div>

<div id="not-found" class="container py-5 text-center">
    <p class="display-1">🎮</p>
    <h2 class="text-uppercase" style="font-family:'Barlow Condensed',sans-serif; color:var(--accent);">Game Not Found</h2>
    <p class="text-secondary mb-4">We couldn't find that game in our store.</p>
    <a href="Home.html" class="btn-buy">← Back to Store</a>
</div>

<div id="detail-content" class="container my-4" style="display:none; max-width:960px;">
    <div class="detail-card">
        <div class="row g-0">
            <div class="col-md-5">
                <img id="g-img" src="" alt="" class="detail-img h-100">
            </div>
            <div class="col-md-7 p-4 d-flex flex-column justify-content-between">
                <div>
                    <h1 id="g-title" class="game-title mb-2"></h1>
                    <div id="g-tags" class="mb-3 d-flex flex-wrap gap-2"></div>
                    <p id="g-desc" class="text-secondary lh-lg mb-3" style="font-size:1rem;"></p>
                    <table class="specs-table w-100">
                        <tbody id="g-specs"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="buy-area text-center p-4">
            <div id="g-price" class="price-display mb-3"></div>
            <a id="g-buy-btn" href="#" class="btn-buy" style="display:none;">🛒 Buy Now &amp; Download</a>
            <button id="g-dl-btn" class="btn-download" style="display:none;">⬇ Free Download</button>
            <p id="g-buy-note" class="text-secondary small mt-3 mb-0">🔒 Secure payment · Instant digital delivery</p>
        </div>
    </div>
</div>

<footer class="text-center py-4 border-top border-secondary mt-5" style="color:var(--dim); font-size:0.8rem;">
    © 2025 GameStore. All rights reserved. · All prices in INR.
</footer>

(function () {
    const params = new URLSearchParams(window.location.search);
    const key    = (params.get("game") || "").toLowerCase().trim();
    const game   = GAMES[key];

    document.getElementById("loading").style.display = "none";

    if (!game) {
        document.getElementById("not-found").style.display = "block";
        return;
    }

    document.documentElement.style.setProperty("--accent", game.accent);

    document.title = `${game.title} — GameStore`;
    document.getElementById("g-img").src  = game.img;
    document.getElementById("g-img").alt  = game.title;
    document.getElementById("g-title").textContent = game.title;
    document.getElementById("g-desc").textContent  = game.desc;

    // Price display
    const priceEl = document.getElementById("g-price");
    if (game.free) {
        priceEl.innerHTML = `<span class="free-price">FREE</span>`;
    } else {
        priceEl.textContent = game.price;
    }

    const tagsEl = document.getElementById("g-tags");
    game.tags.forEach(t => {
        const span = document.createElement("span");
        span.className = "game-tag";
        span.textContent = t;
        if (game.free && t === "Free to Play") {
            span.style.borderColor = "#27ae60";
            span.style.color       = "#27ae60";
        } else {
            span.style.borderColor = game.accent + "55";
            span.style.color       = game.accent;
        }
        tagsEl.appendChild(span);
    });

    const specsEl = document.getElementById("g-specs");
    game.specs.forEach(([label, val]) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td class="spec-label pe-3" style="width:40%">${label}</td>
            <td class="text-secondary">${val}</td>`;
        specsEl.appendChild(tr);
    });

    // Buy / Download button
    if (game.free) {
        const dlBtn = document.getElementById("g-dl-btn");
        dlBtn.style.display = "inline-block";
        dlBtn.onclick = () => triggerDownload(game.title);
        document.getElementById("g-buy-note").innerHTML =
            '✅ 100% Free · No credit card required · Instant download';
        document.getElementById("g-buy-note").style.color = "#27ae60";
    } else {
        const buyBtn = document.getElementById("g-buy-btn");
        buyBtn.style.display = "inline-block";
        buyBtn.href = `payment.html?game=${game.payKey}&price=${game.priceRaw}`;
    }

    document.getElementById("detail-content").style.display = "block";
})();

function triggerDownload(gameName) {
    const lines = [
        '╔══════════════════════════════════════════╗',
        '║        GameStore – Official Installer     ║',
        '╚══════════════════════════════════════════╝',
        '',
        '  Game   : ' + gameName,
        '  Version: 1.0.0',
        '  Date   : ' + new Date().toLocaleDateString('en-IN'),
        '',
        '  This is a FREE game. No payment required.',
        '',
        '  In a production build, this file would be',
        '  the real game setup executable. Your download',
        '  would begin automatically.',
        '',
        '  Thank you for using GameStore!',
        '',
        '══════════════════════════════════════════════',
        '  GameStore © 2025 · All Rights Reserved',
        '══════════════════════════════════════════════'
    ].join('\r\n');

    const blob = new Blob([lines], { type: 'application/octet-stream' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = gameName.replace(/[^a-zA-Z0-9]/g, '_') + '_Free_Setup.exe';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}
