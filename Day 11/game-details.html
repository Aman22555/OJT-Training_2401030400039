    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --accent: #d57454;
            --bg: #0a0c0e;
            --card: #12151a;
            --border: #1e2228;
            --text: #e8e0d6;
            --dim: #7a8090;
        }
        body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); }

        .navbar-brand {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.6rem; font-weight: 800;
            color: var(--accent) !important;
            letter-spacing: 2px;
        }
        .back-link {
            color: var(--dim); font-weight: 600; font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 1px;
            text-decoration: none; transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent); }

        .detail-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }
        .detail-img {
            width: 100%; height: 320px;
            object-fit: cover;
            display: block;
        }
        .game-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 2.8rem; font-weight: 800;
            text-transform: uppercase;
            color: var(--accent);
            line-height: 1;
        }
        .game-tag {
            font-size: 0.78rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
            padding: 3px 12px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            display: inline-block;
        }
        .spec-label {
            color: var(--accent);
            font-weight: 700; font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .specs-table td { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        .specs-table tr:last-child td { border-bottom: none; }

        .buy-area { background: #0d0f12; border-top: 1px solid var(--border); }
        .price-display {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 3rem; font-weight: 800;
            color: var(--accent);
        }
        .btn-buy {
            background: var(--accent); color: #fff;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.2rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px;
            border: none; border-radius: 4px;
            padding: 14px 48px;
            transition: background 0.2s, transform 0.1s;
            text-decoration: none; display: inline-block;
        }
        .btn-buy:hover { background: #bf5f40; color: #fff; transform: translateY(-2px); }

        .btn-download {
            background: #27ae60; color: #fff;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.2rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px;
            border: none; border-radius: 4px;
            padding: 14px 48px; cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-block;
        }
        .btn-download:hover { background: #1e8449; transform: translateY(-2px); }

        .free-price {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 3rem; font-weight: 800;
            color: #27ae60;
        }
        .badge-free {
            background: #27ae60; color: #fff;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.75rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px;
            padding: 3px 10px; border-radius: 3px;
            display: inline-block; margin-left: 8px;
            vertical-align: middle;
        }

        [data-accent] { --accent: attr(data-accent); } 
        #not-found { display: none; }
    </style>
</head>

<div id="not-found" class="container py-5 text-center">

        </div>
    </div>
</div>

(function () {
    const params = new URLSearchParams(window.location.search);
    const key    = (params.get("game") || "").toLowerCase().trim();

    // --- Merge localStorage overrides into the hardcoded game entry ---
    let game = GAMES[key] ? { ...GAMES[key] } : null;
    try {
        const stored = localStorage.getItem('gs_games');
        if (stored) {
            const lsGames = JSON.parse(stored);
            const lsGame  = lsGames.find(g => g.id === key);
            if (lsGame) {
                if (!game) {
                    // Brand-new game added via admin — build a minimal entry
                    game = {
                        title:  lsGame.title,
                        desc:   lsGame.description || '',
                        img:    lsGame.img,
                        price:  lsGame.price === 0 ? 'FREE' : '₹' + Number(lsGame.price).toLocaleString('en-IN'),
                        priceRaw: String(lsGame.price),
                        free:   lsGame.price === 0,
                        payKey: lsGame.title,
                        accent: '#d57454',
                        tags:   [lsGame.genre, lsGame.platform || 'PC'].filter(Boolean),
                        specs:  [
                            ['Platform',  lsGame.platform || 'PC'],
                            ['Storage',   lsGame.storage  || '—'],
                            ['Genre',     lsGame.genre    || '—'],
                        ],
                        sys_reqs: []
                    };
                } else {
                    // Override editable fields from localStorage
                    if (lsGame.img)         game.img   = lsGame.img;
                    if (lsGame.title)       game.title = lsGame.title;
                    if (lsGame.description) game.desc  = lsGame.description;
                    if (typeof lsGame.price !== 'undefined') {
                        game.free     = lsGame.price === 0;
                        game.priceRaw = String(lsGame.price);
                        game.price    = lsGame.price === 0 ? 'FREE' : '₹' + Number(lsGame.price).toLocaleString('en-IN');
                    }
                }
            }
        }
    } catch(e) { /* keep hardcoded data on parse error */ }

    document.getElementById("loading").style.display = "none";

    if (!game) {
        document.getElementById("not-found").style.display = "block";
        return;
    }

    document.documentElement.style.setProperty("--accent", game.accent || '#d57454');

    document.title = `${game.title} — GameStore`;
    const imgEl = document.getElementById("g-img");
    imgEl.src  = game.img;
    imgEl.alt  = game.title;
    imgEl.onerror = function() {
        this.onerror = null;
        this.src = `https://placehold.co/800x450/12151a/d57454?text=${encodeURIComponent(game.title)}`;
    };
    document.getElementById("g-title").textContent = game.title;
    document.getElementById("g-desc").textContent  = game.desc;

    // Price display
    const priceEl = document.getElementById("g-price");
    if (game.free) {
        priceEl.innerHTML = `<span class="free-price">FREE</span>`;
    } else {
        priceEl.textContent = game.price;
    }

    const tagsEl = document.getElementById("g-tags");
    (game.tags || []).forEach(t => {
        const span = document.createElement("span");
        span.className = "game-tag";
        span.textContent = t;
        if (game.free && t === "Free to Play") {
            span.style.borderColor = "#27ae60";
            span.style.color       = "#27ae60";
        } else {
            span.style.borderColor = (game.accent || '#d57454') + "55";
            span.style.color       = game.accent || '#d57454';
        }
        tagsEl.appendChild(span);
    });

    const specsEl = document.getElementById("g-specs");
    (game.specs || []).forEach(([label, val]) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td class="spec-label pe-3" style="width:40%">${label}</td>
            <td class="text-secondary">${val}</td>`;
        specsEl.appendChild(tr);
    });

    // Buy / Download button
    if (game.free) {
        const dlBtn = document.getElementById("g-dl-btn");
        dlBtn.style.display = "inline-block";
        dlBtn.onclick = () => triggerDownload(game.title);
        document.getElementById("g-buy-note").innerHTML =
            '✅ 100% Free · No credit card required · Instant download';
        document.getElementById("g-buy-note").style.color = "#27ae60";
    } else {
        const buyBtn = document.getElementById("g-buy-btn");
        buyBtn.style.display = "inline-block";
        buyBtn.href = `payment.html?game=${game.payKey}&price=${game.priceRaw}`;
    }

    document.getElementById("detail-content").style.display = "block";
})();

function triggerDownload(gameName) {
    const lines = [
        '╔══════════════════════════════════════════╗',
        '║        GameStore – Official Installer     ║',
        '╚══════════════════════════════════════════╝',
        '',
        '  Game   : ' + gameName,
        '  Version: 1.0.0',
        '  Date   : ' + new Date().toLocaleDateString('en-IN'),
        '',
        '  This is a FREE game. No payment required.',
        '',
        '  In a production build, this file would be',
        '  the real game setup executable. Your download',
        '  would begin automatically.',
        '',
        '  Thank you for using GameStore!',
        '',
        '══════════════════════════════════════════════',
        '  GameStore © 2025 · All Rights Reserved',
        '══════════════════════════════════════════════'
    ].join('\r\n');

    const blob = new Blob([lines], { type: 'application/octet-stream' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = gameName.replace(/[^a-zA-Z0-9]/g, '_') + '_Free_Setup.exe';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}
