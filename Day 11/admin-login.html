<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameStore — Admin Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --accent: #d57454;
            --accent-dim: rgba(213,116,84,.15);
            --bg: #07090c;
            --card: #0f1318;
            --border: #1c2130;
            --text: #e8e0d6;
            --dim: #5a6275;
            --danger: #e05252;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* Animated grid background */
        .grid-bg {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(213,116,84,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(213,116,84,.04) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridShift 20s linear infinite;
        }
        @keyframes gridShift { to { background-position: 48px 48px; } }
        .glow-orb {
            position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; pointer-events: none;
        }
        .glow-orb-1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(213,116,84,.08), transparent 70%); top: -200px; left: -200px; }
        .glow-orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(213,116,84,.05), transparent 70%); bottom: -100px; right: -100px; }

        .login-wrap {
            position: relative; z-index: 10;
            width: 100%; max-width: 420px;
            padding: 16px;
        }
        .brand {
            text-align: center; margin-bottom: 32px;
        }
        .brand-logo {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 2.2rem; font-weight: 900;
            color: var(--accent); letter-spacing: 4px;
            text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .brand-sub {
            font-size: .72rem; text-transform: uppercase; letter-spacing: 3px;
            color: var(--dim); margin-top: 6px;
        }
        .admin-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(213,116,84,.1); border: 1px solid rgba(213,116,84,.3);
            color: var(--accent); font-size: .7rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px;
            padding: 4px 14px; border-radius: 20px; margin-top: 10px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 36px 32px;
            box-shadow: 0 24px 64px rgba(0,0,0,.5);
        }
        .card-header-text {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.5rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .card-sub { font-size: .82rem; color: var(--dim); margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        label {
            display: block; font-size: .7rem; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--dim); margin-bottom: 8px;
        }
        .input-wrap { position: relative; }
        .input-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--dim); font-size: 1rem; pointer-events: none;
            transition: color .2s;
        }
        input {
            width: 100%; background: #0a0d12; border: 1px solid var(--border);
            border-radius: 6px; color: var(--text);
            font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 500;
            padding: 12px 14px 12px 42px;
            outline: none; transition: border-color .2s, box-shadow .2s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(213,116,84,.12); }
        input:focus + .input-icon, .input-wrap:focus-within .input-icon { color: var(--accent); }
        .toggle-pw {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--dim); cursor: pointer;
            transition: color .2s; font-size: 1rem;
        }
        .toggle-pw:hover { color: var(--accent); }
        .error-msg {
            display: none; background: rgba(224,82,82,.1); border: 1px solid rgba(224,82,82,.3);
            border-radius: 6px; padding: 10px 14px;
            color: var(--danger); font-size: .82rem;
            align-items: center; gap: 8px; margin-bottom: 16px;
        }
        .error-msg.show { display: flex; }
        .btn-submit {
            width: 100%; padding: 14px;
            background: var(--accent); border: none; border-radius: 6px;
            color: #fff; font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.1rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer;
            transition: background .2s, box-shadow .2s, transform .1s;
            margin-top: 8px;
        }
        .btn-submit:hover { background: #bf5f40; box-shadow: 0 0 24px rgba(213,116,84,.3); }
        .btn-submit:active { transform: scale(.98); }
        .btn-submit.loading { opacity: .7; pointer-events: none; }
        .footer-links {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 20px; font-size: .75rem; color: var(--dim);
        }
        .footer-links a { color: var(--dim); text-decoration: none; transition: color .2s; }
        .footer-links a:hover { color: var(--accent); }
        .security-note {
            display: flex; align-items: center; gap: 8px;
            padding: 12px 16px; background: rgba(28,33,48,.5);
            border: 1px solid var(--border); border-radius: 6px;
            margin-top: 20px; font-size: .73rem; color: var(--dim);
        }
        .security-note i { color: var(--accent); flex-shrink: 0; }
        /* Loading spinner */
        .spinner {
            display: none; width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,.3);
            border-top-color: #fff; border-radius: 50%;
            animation: spin .6s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-submit.loading .btn-text { display: none; }
        .btn-submit.loading .spinner { display: block; }
    </style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow-orb glow-orb-1"></div>
<div class="glow-orb glow-orb-2"></div>

<div class="login-wrap">
    <div class="brand">
        <div class="brand-logo"><i class="bi bi-controller"></i> GameStore</div>
        <div class="brand-sub">Management Portal</div>
        <div class="admin-badge"><i class="bi bi-shield-lock-fill"></i> Admin Access Only</div>
    </div>

    <div class="card">
        <div class="card-header-text">Admin Sign In</div>
        <div class="card-sub">Restricted area — authorised personnel only</div>

        <div class="error-msg" id="errorMsg">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span id="errorText">Invalid credentials. Please try again.</span>
        </div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label>Admin Username</label>
                <div class="input-wrap">
                    <input type="text" id="adminUser" placeholder="Enter admin username" autocomplete="username" required>
                    <i class="bi bi-person-badge input-icon"></i>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <input type="password" id="adminPass" placeholder="Enter admin password" autocomplete="current-password" required>
                    <i class="bi bi-lock input-icon"></i>
                    <button type="button" class="toggle-pw" onclick="togglePw()">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text"><i class="bi bi-shield-check me-2"></i> Access Admin Panel</span>
                <div class="spinner"></div>
            </button>
        </form>

        <div class="footer-links">
            <a href="Home.html"><i class="bi bi-arrow-left me-1"></i> Back to Store</a>
            <span>GameStore © 2025</span>
        </div>

        <div class="security-note">
            <i class="bi bi-info-circle-fill"></i>
            <span>All admin actions are logged. Unauthorised access is prohibited.</span>
        </div>
    </div>
</div>

<script>
    const ADMIN_USER = 'Aman Vishwakarma';
    const ADMIN_PASS = 'G057528Aman@';

    function togglePw() {
        const input = document.getElementById('adminPass');
        const icon  = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        document.getElementById('errorText').textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 4000);
    }

    function handleAdminLogin(e) {
        e.preventDefault();
        const user = document.getElementById('adminUser').value.trim();
        const pass = document.getElementById('adminPass').value;
        const btn  = document.getElementById('submitBtn');

        btn.classList.add('loading');

        setTimeout(() => {
            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                sessionStorage.setItem('gs_admin', 'true');
                sessionStorage.setItem('gs_admin_user', user);
                sessionStorage.setItem('gs_admin_login_time', new Date().toISOString());
                window.location.href = 'admin.html';
            } else {
                btn.classList.remove('loading');
                showError('Invalid username or password. Access denied.');
                document.getElementById('adminPass').value = '';
                document.getElementById('adminPass').focus();
            }
        }, 900);
    }

    // Redirect if already logged in
    if (sessionStorage.getItem('gs_admin') === 'true') {
        window.location.href = 'admin.html';
    }
</script>
</body>
</html>
